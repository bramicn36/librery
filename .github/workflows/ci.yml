
name: Library CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Run tests
        run: |
          python -c "from fastapi.testclient import TestClient; from main import app; client = TestClient(app); response = client.get('/health'); assert response.status_code == 200; assert response.json() == {'status': 'ok'}"

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start server and health check
        run: |
          python -m uvicorn main:app --host 0.0.0.0 --port 8000 > /tmp/app.log 2>&1 &
          sleep 5
          curl -sf http://127.0.0.1:8000/health